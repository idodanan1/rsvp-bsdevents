services:
  # Backend Service
  - type: web
    name: whatsapp-backend
    env: node
    plan: free
    buildCommand: cd whatsapp-backend && npm install
    startCommand: cd whatsapp-backend && node server.js
    envVars:
      - key: PORT
        value: 3002
      - key: WEBHOOK_VERIFY_TOKEN
        value: whatsapp_webhook_verify_token_2024
      - key: NODE_ENV
        value: production
      # הוסף את ה-tokens שלך כאן:
      # - key: WHATSAPP_ACCESS_TOKEN
      #   value: your_token_here
      # - key: WHATSAPP_PHONE_NUMBER_ID
      #   value: 874204535776090

  # Frontend Service  
  - type: static
    name: rsvp-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    nodeVersion: 18
    envVars:
      # זה יתעדכן אוטומטית לאחר פריסת ה-backend
      - key: VITE_BACKEND_URL
        fromService:
          name: whatsapp-backend
          type: web
          property: host

