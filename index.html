<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="מערכת ניהול הזמנות ואישורי הגעה" />
    <meta name="theme-color" content="#14b8a6" />
    <title>מערכת ניהול הזמנות</title>
    <style>
      /* Prevent black screen - always show background */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom right, #f0fdfa, #fefce8);
        min-height: 100vh;
      }
      
      /* Loading screen to prevent blank page */
      #root:empty::before {
        content: "טוען...";
        display: block;
        text-align: center;
        padding: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(to bottom right, #f0fdfa, #fefce8);">
        <div style="text-align: center; color: #666;">
          <p>טוען...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
